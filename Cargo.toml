[package]
name = "porin"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
description = "Rate limiting for Rust services: several algorithms, shared storage, any framework"
license = "MIT OR Apache-2.0"
repository = "https://github.com/YabetsZ/porin"
readme = "README.md"
keywords = ["rate-limit", "ratelimit", "distributed", "redis", "tower"]
categories = ["network-programming", "web-programming", "concurrency"]

[features]
default = ["memory"]
memory = ["dep:futures-timer", "dep:hashbrown"]
blocking = ["memory"]
redis-tokio = ["memory", "dep:redis", "redis/tokio-comp"]
redis-smol = ["memory", "dep:redis", "redis/smol-comp"]
quanta = ["dep:quanta"]

[dependencies]
futures-timer = { version = "3.0.4", optional = true }
hashbrown = { version = "0.17.1", default-features = false, features = ["inline-more"], optional = true }
quanta = { version = "0.12.6", optional = true }
redis = { version = "1.2.2", optional = true, default-features = false, features = ["script", "connection-manager", "cluster-async", "sentinel"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)", "cfg(docsrs)", "cfg(porin_bench)"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

[dev-dependencies]
divan = "0.1.21"
governor = "0.10.4"
pollster = "1.0.3"
proptest = "1.11.0"
trybuild = "1.0.119"

# Only the Redis tests and benchmark use tokio, and it doesn't build under
# `--cfg loom`.
[target.'cfg(not(loom))'.dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }

[[bench]]
name = "memory"
harness = false
required-features = ["memory"]

[[bench]]
name = "compare"
harness = false
required-features = ["memory"]

[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"
